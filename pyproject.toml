[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-osint"
version = "0.1.0"
description = "Evidence-grade, passive OSINT toolkit for journalists and fraud victims (English / Ελληνικά)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # standard library only, by design
license = "Apache-2.0" 
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Natural Language :: English",
    "Natural Language :: Greek",
    "Topic :: Security",
]

[project.scripts]
aletheia = "aletheia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aletheia = ["locales/*.toml", "packs/*.toml"]
