# Seed list of brands that scammers impersonate, used for look-alike domain detection.
# This is community-maintained seed data: verify an entry before relying on it, and send a pull
# request to add or correct brands. "domains" are the OFFICIAL registrable domains.

[stoplist]
# Domains too common to be useful as a correlation signal between pieces of evidence.
domains = ["instagram.com", "facebook.com", "google.com", "youtube.com", "wa.me", "whatsapp.com", "t.me",
           "telegram.org", "x.com", "twitter.com", "tiktok.com", "linkedin.com", "gmail.com", "googlemail.com",
           "outlook.com", "hotmail.com", "yahoo.com", "icloud.com", "proton.me", "protonmail.com",
           "apple.com", "microsoft.com", "gov.gr", "wikipedia.org"]

