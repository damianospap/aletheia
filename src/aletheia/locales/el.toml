# ---- Πολιτική Αποδεκτής Χρήσης ------------------------------------------------------------
"msg.aup_header" = "Πολιτική Αποδεκτής Χρήσης (έκδοση {version}):"
"aup.item1" = "Χρησιμοποιήστε το Aletheia μόνο για δημοσιογραφία ή για την τεκμηρίωση και καταγγελία απάτης, και μόνο με δημόσιες πληροφορίες ή υλικό που έχετε νόμιμο δικαίωμα να κατέχετε."
"aup.item2" = "Μην αποκτάτε ποτέ πρόσβαση σε λογαριασμούς, συσκευές ή συστήματα χωρίς εξουσιοδότηση και μην παρακάμπτετε ποτέ την απαίτηση σύνδεσης, τα όρια χρήσης ή άλλα τεχνικά μέτρα προστασίας."
"aup.item3" = "Αντιμετωπίστε κάθε εύρημα ως ένδειξη και όχι ως απόφαση: οι απατεώνες συχνά χρησιμοποιούν κλεμμένες φωτογραφίες και ταυτότητες, επομένως μην κατονομάζετε και μην κατηγορείτε πρόσωπο μόνο με βάση αυτό το εργαλείο."
"aup.item4" = "Μη δημοσιεύετε προσωπικά δεδομένα μη επαληθευμένων προσώπων και μη χρησιμοποιείτε το εργαλείο για παρενόχληση, παρακολούθηση ιδιωτών ή μαζική κατάρτιση προφίλ."
"aup.item5" = "Καταγγείλετε την απάτη στις αρμόδιες αρχές (στην Ελλάδα, στη Δίωξη Ηλεκτρονικού Εγκλήματος) και παραδώστε το εξαγόμενο πακέτο αντί να αντιμετωπίσετε τον δράστη."
"aup.item6" = "Είστε υπεύθυνοι για τη συμμόρφωση με το δίκαιο που σας αφορά (προστασία δεδομένων, ποινικό δίκαιο, όροι πλατφορμών). Το εργαλείο δεν παρέχει νομική συμβουλή."

