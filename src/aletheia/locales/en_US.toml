"bundle.verify_text" = """HOW TO VERIFY THIS BUNDLE
1. Easiest: run  python3 verify.py  in this folder (Windows, macOS, Linux and Termux; needs only Python 3.6 or newer).
2. Manually: compare each file's SHA-256 with manifest.json (Linux: sha256sum FILE; macOS: shasum -a 256 FILE; Windows: certutil -hashfile FILE SHA256).
3. Keep a copy of the audit head hash printed in the report somewhere independent (email it to yourself, publish it or timestamp it). It proves this bundle existed in this form at that time."""

