# ---- AUP ----------------------------------------------------------------------------------
"msg.aup_header" = "Acceptable Use Policy (version {version}):"
"aup.item1" = "Use Aletheia only for journalism or to document and report fraud, and only with public information or material you are legitimately entitled to hold."
"aup.item2" = "Never access accounts, devices or systems without authorisation, and never bypass login walls, rate limits or other technical protections."
"aup.item3" = "Treat every finding as a lead, not a verdict: scammers often use stolen photos and identities, so never name or accuse a person on the basis of this tool alone."
"aup.item4" = "Do not publish personal data about unverified people, and do not use the tool for harassment, stalking, surveillance of private individuals or profiling at scale."
"aup.item5" = "Report fraud to the competent authorities (in Greece, the Cyber Crime Division) and hand over the exported bundle instead of confronting the offender."
"aup.item6" = "You are responsible for complying with the law that applies to you (data protection, criminal law, platform terms). This tool provides no legal advice."

